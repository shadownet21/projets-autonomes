<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
 
   <body>

  <h1>JS101 #1 Calculateur (addition)</h1>

  <label>
    Nombre A :
    <input id="a" type="number" />
  </label>

<br>
<br>

  <label>
    Nombre B :
    <input id="b" type="number" />
  </label>

<br>
<br>

  <button id="btnCalculer">Calculer</button> <br> <br>

   <p>  Résultat :  <span id="resultat"></span> </p>

  <script>


                let bouton_calculuer =  document.querySelector("#btnCalculer");

             

                  bouton_calculuer.addEventListener("click", function(){

                          console.clear();
                                         
                          const num1 =  Number(document.querySelector('#a').value);

                          console.log(num1);

                          console.log("Le type de num1 est " + typeof(num1));
                          
                          
                          const num2 =  Number(document.querySelector('#b').value);

                          console.log(num2);

                          console.log("Le type de num2 est " + typeof(num2));
                          
                          const somme =  num1+num2;
                            
                            
                          console.log("La somme des nombres " + num1 + " et "+ num2 + " est : " + somme);

                          document.querySelector("#resultat").textContent = somme;

                
                                         
                  });

  </script>
                 
   
</body>
</html>
