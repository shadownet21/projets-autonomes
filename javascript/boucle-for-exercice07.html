<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
   <body>

  
         <div 
            id="boite"
            style="background-color: rgb(230, 120, 38); width: 100px; height: 100px"
            >
        </div>


 
   

    <br>

    <button id="monBouton">Changer la couleur</button>
   

    <script>
        let Caracteres = [1, 2, 3, 4, 5, 6, 7, 8, 9, "a", "b", "c", "d", "e", "f"];

        let couleur = "";

        let tab = [];

       // (Math.round(Math.random()) * 15)

        /*
        vous devez changer la couleur de la boite.
        En cliquant sur le bouton, JS doit parcourir
        le tableau de façon aléatoire et choisir 6 caractères
        afin de construire un code de couleur "hex".
        */
       
        
         const bouton = document.querySelector("#monBouton");

         bouton.addEventListener("click",  () => {

        couleur = "#";

        for (let i = 0; i < 6; i++) {

            const indexAleatoire = Math.random() * Caracteres.length;

            const indexAleatoireFormate = Math.floor(indexAleatoire);

            couleur += Caracteres[indexAleatoireFormate];
        }

        console.log(couleur);

        const boite  = document.querySelector("#boite");

        boite.style.backgroundColor = couleur;
        

    });






    </script>
</body>
</html>
