<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {

       font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }

        .chargerBtn {

                width: 150px;
                height: 30px;

        }
    </style>
</head>
<body>
    <h1>Prise en main de Json</h1>

    <button onclick="chargerEmployes()" class="chargerBtn">Charger</button>



<script>

let btnCharger = document.querySelector(".chargerBtn");


    const ul = document.createElement("ul");

    document.body.appendChild(ul);

async function chargerEmployes(){

                try {
                        
                        const response =  await fetch('employes.json');
                        const  {employes}  = await response.json();

                        console.log(employes);

                         ul.innerHTML = "";

                        employes.forEach(employe => {

                        let idEmploye = "N. " + employe.id;
                        let nomEmploye = "Nom :  " + employe.nom;
                        let prenomEmploye = "Prénoms :  " + employe.prenom;
                        let ageEmploye = "Age :  " + employe.age;
                        let posteEmploye = "Poste :  " + employe.poste;

                        let infosEmployes = idEmploye + " - " +nomEmploye + " , " + prenomEmploye + " " + ageEmploye + " " + posteEmploye;

                        let li = document.createElement("li");
                        li.textContent = infosEmployes;

                        ul.appendChild(li);

                        ul.appendChild(document.createElement("br"));

                        localStorage.setItem("listeItems", JSON.stringify(employes));
                        
                       });

                        
                    
                } catch (error) {

                    
                    console.error("Une erreur est survenue : ", error.message);
}


}


</script>

</body>
</html>
