<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tasks List</title>
</head>
<body>
    <div class="card">
         <div class="entete">
                <h1>To - Do List</h1>
                <input type="text" placeholder="Libellé de la tâche" id="libelle">
                <button id="ajouter">Ajouter</button>
                <span id="message"></span>
        </div>
        <div class="page">
            <h2>
                Liste des tâches
            </h2>
            <table border="1">
                <thead>
                    <tr>
                    <th>ID</th>
                    <th>Tâche</th>
                    <th>Action</th>
                    </tr>
                </thead>

                <tbody id="liste-taches">
                    <!-- Les tâches seront ajoutées ici dynamiquement -->
                </tbody>
            </table>

             <h2>
                Liste des tâches complétées
            </h2>
            <table border="1">
                <thead>
                    <tr>
                    <th>ID</th>
                    <th>Tâche</th>
                    <th>Etat</th>
                    </tr>
                </thead>

                <tbody id="liste-taches-completees">
                    <!-- Les tâches complétées seront ajoutées ici dynamiquement -->
                </tbody>
            </table>


        </div>
    </div>
   
<script src="scripts.js"></script>    
</body>
</html>
